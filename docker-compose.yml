services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Persists the SQLite predictions DB across restarts (task
      # requirement) and supplies data/processed/features.csv, which is
      # too large and too licensed-adjacent to bake into the image -- see
      # README.md's "Dataset setup" for how to produce it before first run.
      - ./data:/app/data
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 60s, not the original 15s -- widened after this hardening pass's
      # non-root fix (docker-entrypoint.sh) added a real, measured
      # increase to cold-start time: `chown -R appuser:appuser /app/data`
      # runs on every container start against the bind-mounted data/
      # directory (the 162MB+ features.csv included), and that chown plus
      # the now-non-root file reads during model/feature loading pushed
      # observed startup to ~30-55s on this Windows/Docker-Desktop
      # environment -- found live (the 15s original start_period +
      # 5x10s retries intermittently reported "unhealthy" and aborted
      # `docker compose up` before startup actually finished), not a
      # theoretical margin pick. 60s start_period + 5x10s retries gives
      # real headroom over the worst case observed.
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time (Vite env vars are compile-time).
        # Relative, not an absolute host:port -- nginx (frontend/nginx.conf)
        # reverse-proxies /api/* to the backend container over the compose
        # network's own DNS, so the browser only ever talks to whatever
        # origin actually served the page. This is what makes the SAME
        # built image work unmodified whether it's reached via
        # localhost:3000, a different LAN IP, or a tunnel/port-forward
        # service (found live: a VS Code dev tunnel forwarding only the
        # frontend's port broke the old absolute
        # http://localhost:8000/api/v1 default outright -- "localhost"
        # from a tunnel visitor's browser means THEIR machine, not this
        # one). Override this only if you have a real reason to bypass
        # the proxy and call the backend directly.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      # Container-side 8080, not 80 -- frontend/Dockerfile now runs nginx
      # unprivileged (non-root), which listens on 8080 by design (see
      # nginx.conf). The host-facing port is unchanged: still
      # FRONTEND_PORT (default 3000).
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
