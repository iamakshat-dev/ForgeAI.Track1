server {
    # 8080, not 80 -- this runs under nginxinc/nginx-unprivileged (see
    # frontend/Dockerfile), specifically so the container process never
    # needs root/CAP_NET_BIND_SERVICE just to bind its own port. The
    # host-facing port (docker-compose.yml's FRONTEND_PORT, default 3000)
    # is unaffected -- Docker's port mapping still publishes it exactly
    # where it always has.
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Scoped to this app's actual resource origins: Google Fonts
    # (stylesheet + font files, see index.html) and the API.
    #
    # TWO REAL BUGS FOUND LIVE (curl doesn't enforce CSP, so the earlier
    # pass's `docker compose`/curl verification never caught either --
    # only an actual browser does, confirmed via a headless-Chrome console
    # check after the app reported "couldn't reach API"):
    #
    # 1. connect-src was `'self' https:` -- HTTPS-only, on the theory that
    #    hardcoding a local origin would do nothing useful and a real
    #    deployment would be HTTPS anyway. Wrong: this app's actual local/
    #    dev deployment talks to a PLAIN-HTTP backend
    #    (VITE_API_BASE_URL=http://localhost:8000/api/v1, see
    #    docker-compose.yml), and CSP enforces regardless of "local or
    #    not" -- every fetch() call was silently blocked. Fixed by adding
    #    explicit http://localhost:*/127.0.0.1:* alongside https: (a port
    #    wildcard, so a customized BACKEND_PORT still works) -- scoped to
    #    local addresses specifically, not a blanket allow-any-HTTP-site.
    # 2. script-src was `'self'` with no allowance for index.html's small
    #    inline theme-flash-prevention script, which a strict CSP blocks
    #    by default. Fixed with that exact script's own sha256 hash
    #    (narrower and safer than 'unsafe-inline', which would allow ANY
    #    inline script to run) -- if that inline script's content ever
    #    changes, this hash must be recomputed to match or it breaks again
    #    the same way.
    # connect-src is just 'self' now -- the API is proxied through THIS
    # same origin (see location /api/ below), not called cross-origin
    # anymore. That's the actual fix for a real bug found live: this app
    # accessed through a VS Code dev tunnel (frontend port forwarded,
    # backend port not) got "couldn't reach API" because the frontend's
    # baked-in VITE_API_BASE_URL was an absolute http://localhost:8000
    # URL -- meaningless from a browser on a different machine, where
    # "localhost" is THEIR machine, not this one. A reverse proxy makes
    # the API same-origin everywhere the frontend is reachable (plain
    # Docker, localhost, a tunnel, a real domain) with no per-environment
    # URL to get right, and CSP can be its intended, tighter self-only
    # policy instead of the wider localhost/127.0.0.1-wildcard version
    # that HTTP work used to require.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-0I1Gi001NPwWq1QQHDPts0AFniO/TMTr6ArOblhQ3ls='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxies every /api/* call to the backend container over the
    # compose network's own internal DNS (service name `backend`, port
    # 8000 -- never the host-published port, this traffic never leaves
    # the Docker network). `/api/` -> `/api/` is a deliberate no-op path
    # rewrite: only nginx's OWN location-matching prefix is being
    # replaced, so /api/v1/health forwards as .../api/v1/health, matching
    # api/main.py's actual `/api/v1` route prefix exactly.
    #
    # Known, accepted tradeoff: the backend still sees every proxied
    # request as coming from nginx's container IP, not the real client --
    # per-IP rate limiting (api/services/rate_limiter.py) effectively
    # becomes "shared across everyone behind this proxy" for traffic that
    # arrives this way, rather than genuinely per-visitor. Not fixed here
    # (would need uvicorn's --proxy-headers trusting nginx specifically,
    # while the backend's own port 8000 is still directly published --
    # trusting X-Forwarded-For unconditionally there would let a direct
    # caller spoof their way past the limiter, a worse problem than the
    # one being solved) -- stated plainly rather than silently accepted.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any path not matching a real static file (e.g.
    # /transactions/txn_123, /chargebacks/cb_456 on a hard refresh) is
    # served index.html so React Router's client-side routing can take
    # over, instead of nginx returning a 404 for a route that only
    # exists in JS.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
